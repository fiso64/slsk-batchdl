name: .NET CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**/packages.lock.json'
      - '.editorconfig'
      - '**/global.json'
      - '**/nuget.config'
      - '.github/workflows/**.yml'

  push:
    branches:
      - master
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**/packages.lock.json'
      - '.editorconfig'
      - '**/global.json'
      - '**/nuget.config'
      - '.github/workflows/**.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        # The cache key invalidates when the lock file changes
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release

    - name: Test Project
      # Each assembly already parallelizes internally. Running all four test
      # hosts concurrently oversubscribes hosted runners and starves async
      # continuations, producing unrelated five-second timeout failures.
      run: dotnet test --no-build --configuration Release --verbosity normal --maxcpucount:1

    - name: Run Load Qualifications
      run: dotnet test --no-build --configuration Release --filter TestCategory=Load --verbosity normal --maxcpucount:1

  format-check:
    if: false  # disabled: dotnet format has platform-sensitive indentation behavior
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Format code
      run: dotnet format --verify-no-changes
